<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->

        <div th:replace="~{fragments/layout :: sidebar}"></div>
        <!-- Page Content -->
        <div id="page-content-wrapper">
            <div th:replace="~{fragments/layout :: navbar}"></div>


            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Edit Student</h2>
                    <a th:href="@{/students/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-pencil-square me-1"></i> Edit Student Details
                    </div>
                    <div class="card-body">

                        <form th:action="@{/students/{id}/update(id=${studentsDTO.id})}"
                              th:object="${studentsDTO}"
                              method="post">

                            <!-- Student ID -->
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label th:for="*{firstname}" class="form-label">First Name</label>
                                    <input type="text"
                                           th:field="*{firstname}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('firstname')} ? 'is-invalid' : ''"
                                           required>

                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('firstname')}"
                                         th:errors="*{firstname}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label th:for="*{lastname}" class="form-label">Last Name</label>
                                    <input type="text"
                                           th:field="*{lastname}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('lastname')} ? 'is-invalid' : ''"
                                           required>

                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('lastname')}"
                                         th:errors="*{lastname}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label th:for="*{email}" class="form-label">Email Address</label>
                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           required>

                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label th:for="*{phoneNumber}" class="form-label">Phone Number</label>
                                    <input type="tel"
                                           th:field="*{phoneNumber}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                                           required>

                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('phoneNumber')}"
                                         th:errors="*{phoneNumber}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label th:for="*{active}" class="form-label">Is Active</label>

                                    <select th:field="*{active}" class="form-select">
                                        <option value="true">Yes</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label th:for="*{address}" class="form-label">Address</label>

                                <textarea th:field="*{address}"
                                          class="form-control"
                                          rows="3"
                                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"></textarea>

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('address')}"
                                     th:errors="*{address}"></div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <a th:href="@{/students/list}"
                                   class="btn btn-light me-2">
                                    Cancel
                                </a>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    Update Student
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</body>

</html>
