
<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- Header -->
            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">

                    <div>
                        <h2 class="mb-1">Enrollment Details</h2>
                        <p class="mb-0 opacity-75">
                            Overview of courses, fees, and student information.
                        </p>
                    </div>

                    <a th:href="@{/enrollments/enrollmentList}"
                       class="btn btn-light text-primary fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i>
                        Back to Enrolled Students
                    </a>

                </div>
            </div>

            <div class="row g-4">

                <!-- Student Information -->
                <div class="col-lg-4">

                    <div class="card h-100">

                        <div class="card-header bg-white">
                            <i class="bi bi-person-badge me-1"></i>
                            Student Information
                        </div>

                        <div class="card-body">

                            <p class="mb-2">
                                <strong>Student ID:</strong>
                                <span th:text="${enrollmentSummaryDTO.studentId}"></span>
                            </p>

                            <p class="mb-2">
                                <strong>Name:</strong>
                                <span th:text="${enrollmentSummaryDTO.studentName}"></span>
                            </p>

                            <p class="mb-3">
                                <strong>Email:</strong>
                                <span th:text="${enrollmentSummaryDTO.studentEmail}"></span>
                            </p>

                            <hr>

                            <div class="p-3 bg-light border rounded">

                                <div class="d-flex justify-content-between mb-2">
                                    <span>Total Courses</span>

                                    <strong th:text="${enrollmentSummaryDTO.courseCount}">
                                    </strong>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <span>Total Fee</span>

                                    <strong>
                                        ₹<span th:text="${#numbers.formatDecimal(enrollmentSummaryDTO.totalFee, 1, 2)}"></span>
                                    </strong>
                                </div>

                            </div>

                        </div>
                    </div>

                </div>

                <!-- Enrolled Courses -->
                <div class="col-lg-8">

                    <div class="card h-100">

                        <div class="card-header bg-white">
                            <i class="bi bi-journal-check me-1"></i>
                            Enrolled Courses
                        </div>

                        <div class="card-body">

                            <div class="table-responsive">

                                <table class="table table-hover align-middle">

                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Course Name</th>
                                        <th>Description</th>
                                        <th class="text-end">Fee</th>
                                    </tr>
                                    </thead>

                                    <tbody>

                                    <!-- Dynamic Course List -->
                                    <tr th:each="course, iterStat : ${enrollmentSummaryDTO.courseList}">

                                        <td th:text="${iterStat.count}"></td>

                                        <td th:text="${course.courseName}"></td>

                                        <td th:text="${course.description}"></td>

                                        <td class="text-end">
                                            ₹<span th:text="${#numbers.formatDecimal(course.fee, 1, 2)}"></span>
                                        </td>

                                    </tr>

                                    <!-- No Courses -->
                                    <tr th:if="${#lists.isEmpty(enrollmentSummaryDTO.courseList)}">

                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="bi bi-info-circle me-1"></i>
                                            No courses enrolled.
                                        </td>

                                    </tr>

                                    </tbody>

                                </table>

                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', event => {

        const sidebarToggle = document.body.querySelector('#sidebarToggle');

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', event => {
                event.preventDefault();
                document.body.classList.toggle('sb-sidenav-toggled');
            });
        }

    });
</script>

</body>
</html>
