
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Add New Student</h2>
                <a th:href="@{/students/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to List
                </a>
            </div>

            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-person-plus me-1"></i> Student Details
                </div>

                <div class="card-body">

                    <!-- Student Form -->
                    <form th:action="@{/students/save}"
                          th:object="${studentsDTO}"
                          method="post">

                        <div class="row mb-3">

                            <!-- First Name -->
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">
                                    First Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="firstName"
                                       th:field="*{firstname}"
                                       placeholder="e.g. John"
                                       th:classappend="${#fields.hasErrors('firstname')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('firstname')}"
                                     th:errors="*{firstname}">
                                </div>
                            </div>

                            <!-- Last Name -->
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">
                                    Last Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="lastName"
                                       th:field="*{lastname}"
                                       placeholder="e.g. Doe"
                                       th:classappend="${#fields.hasErrors('lastname')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('lastname')}"
                                     th:errors="*{lastname}">
                                </div>
                            </div>

                        </div>

                        <div class="row mb-3">

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       th:field="*{email}"
                                       placeholder="e.g. john.doe@example.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">
                                </div>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       id="phone"
                                       th:field="*{phoneNumber}"
                                       placeholder="e.g. +91 9876543210"
                                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('phoneNumber')}"
                                     th:errors="*{phoneNumber}">
                                </div>
                            </div>

                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Address
                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      rows="3"
                                      th:field="*{address}"
                                      placeholder="Enter full address...">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}">
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end">

                            <button type="reset" class="btn btn-light me-2">
                                Reset
                            </button>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Save Student
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer and Scripts -->
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: script}"></div>

</body>
</html>
